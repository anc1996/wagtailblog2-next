[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wagtailblog2"
version = "0.1.0"
description = "WagtailBlog2 - 独立重建的现代化 Wagtail 内容管理与发布平台骨架"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "WagtailBlog Team" }
]
dependencies = [
    # 2026-11-01 稳定版基线：直接依赖采用精确版本，减少无计划漂移。
    "Django==6.1.2",
    "wagtail==8.0.1",
    "python-dotenv==1.2.4",
    "Pillow==13.0.0",
    "django-modelcluster==6.5",
    "django-taggit==6.1.0",
    # Wagtail 8.0.1 要求 django-treebeard>=4.8,<6.0，不能追随 7.x。
    "django-treebeard==5.3.1",
    "djangorestframework==3.18.3",
]

[project.optional-dependencies]
# 外部存储与服务驱动（骨架阶段严格保持隔离，未来阶段按需启用）
services = [
    "mysqlclient==2.3.0",
    "pymongo==4.19.0",
    "redis==8.1.0",
]
test = [
    "pytest==9.2.0",
    "pytest-django==4.14.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["wagtailblog2*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "wagtailblog2.settings.dev"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
